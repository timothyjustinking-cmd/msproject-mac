# CI is the portability oracle: the project targets macOS but is developed on
# Windows, so the Linux run is the cheap portability proof (macOS core coverage comes from app-macos, which builds every core library there).
#
# Deliberately small: one job per platform, no caching, no packaging, no code
# signing.  Windows proves the MSVC build,
# Linux proves GCC (macOS AppleClang is proved by the app-macos job).  Warnings are errors everywhere, so a warning on one
# compiler is a red build rather than a line nobody reads.
#
# Windows uses Ninja, not the "Visual Studio 17 2022" generator: windows-latest
# stopped exposing an installation that generator could find (CI run 2026-10-22:
# "could not find any instance of Visual Studio").  msvc-dev-cmd loads the MSVC
# environment exactly like vcvars64.bat does locally and Ninja compiles with the
# same cl and the same flags, so the job no longer depends on VS discovery.
#
# See docs/build.md for the local equivalents of these commands.
#
# `mpp_reader` is no longer excluded (2026-10-22, W13): its synthetic fixture is
# committed at tests/data/synthetic-base.mpp, so the reader test runs on a clean
# checkout where corpus/ does not exist.  The checks that genuinely need the real
# corpus (PROJECT_A and PROJECT_B) print SKIP and pass.  A second, focused step re-runs
# the reader test with MPP_NO_CORPUS=1 so the committed-fixture path is proved on
# every run, not merely assumed.  See docs/ci.md.  `--timeout 60` remains the
# safety net for any test that wedges.

name: ci

# COST CONTROL (2026-10-23): the included Actions minutes are exhausted and
# macOS runners bill at 10x.  Do NOT trigger on every push -- a manual dispatch
# or a version tag is a deliberate spend.  Run locally where possible:
#   build\vs-w14 (Windows MSVC) proves the core suite; only ObjC++/AppKit needs
#   the macos-appkit job, so push a tag (or dispatch) once per wave, not per commit.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # Wave 23 (A-9), corrected in wave 24 (W24-10/R9/V): run the core lane when
  # qt-shell finishes, so one dispatch produces both signals.  GitHub only
  # registers a workflow_run trigger from the workflow file on the DEFAULT
  # branch, so this cannot fire for a wave branch until it is merged: until
  # then dispatch both workflows explicitly (the task order says so).
  #   * only a SUCCESSFUL qt-shell run is followed (a red or cancelled Qt run
  #     must not spend a core run);
  #   * the checkout below uses head_sha, so core tests exactly the commit
  #     qt-shell tested, not whatever the branch tip happens to be;
  #   * a qt-shell run caused by a TAG push is ignored: this workflow already
  #     runs on the tag itself, so following it would run ci twice.
  workflow_run:
    workflows: ["qt-shell"]
    types: [completed]

permissions:
  contents: read

jobs:
  build-and-test:
    # Wave 24 (W24-10): see the trigger comment.  `event` is the triggering
    # workflow's event; qt-shell only listens to workflow_dispatch and tag
    # pushes, so "push" here means a tag and must not duplicate the tag run.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'push')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Report every platform even if one fails; a red macos job next to a green
      # windows job is the signal this workflow exists to produce.
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            generator: Ninja
          # macOS core coverage comes from the app-macos job, which builds every
          # core library on macOS anyway; keeping a second macOS job here cost
          # 10x-points per push for very little extra signal (2026-10-23).
          - name: ubuntu-gcc
            os: ubuntu-latest
            generator: Unix Makefiles

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Wave 24 (W24-10): workflow_run has no ref of its own.  Check out the
          # EXACT commit qt-shell tested (head_sha); the old head_branch could
          # check out a newer commit than the one the Qt run proved.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # W27-1.2: check_fixtures.py's oracle-provenance sub-check walks
          # `git log --follow` to find each oracle's last measured-body change;
          # on a one-commit shallow clone every recording_commit fails.  Fetch
          # the full history, as the brief prefers.
          fetch-depth: 0

      # Puts cl.exe, link.exe and Ninja on PATH (and sets INCLUDE/LIB) the same
      # way `vcvars64.bat` does in docs/build.md.  Windows-only: the other two
      # platforms use the compilers the image already provides.
      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # bash exists on all three images (Git Bash on Windows) so the commands
      # below are identical everywhere and are exactly what docs/build.md
      # documents.  Quoted generator names survive the space in a generator name.
      # On Windows this is a single-config Ninja tree, so -DCMAKE_BUILD_TYPE is
      # honoured; on macOS/Linux it is honoured the same way.
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCORE_WARNINGS_AS_ERRORS=ON

      # No --parallel: it buys nothing on a build this size and Ninja already
      # runs the configured number of jobs.  See docs/build.md.
      - name: Build
        shell: bash
        run: cmake --build build --config Release

      # -C Release: harmless on the single-config generators, required if the
      # generator ever becomes multi-config again.  --timeout 60 turns a wedged
      # test into a 60-second failure instead of a hung runner.
      # mpp_reader runs everywhere now that its synthetic fixture is committed
      # (tests/data/synthetic-base.mpp, tests/data/README.md).  plan_recalc is
      # excluded from THIS step because it reads the client corpus when present
      # and its golden is refreshed only deliberately with
      # PLAN_RECALC_UPDATE_GOLDEN=1; the corpus-free 266 checks run in their own
      # step below, with MPP_NO_CORPUS=1 (wave 24 W24-4/R4).  The engine suite
      # IS included (51 core tests: 50 + engine_diff_suite).
      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release -E plan_recalc --output-on-failure --timeout 60

      # Wave 24 (W24-4/R4): wave 23 excluded plan_recalc from CI entirely and
      # lost the 266 checks that do NOT need the corpus (test_base,
      # test_manual_scheduling, test_free_vs_total_slack).  A runner has no
      # corpus/, and the golden is read-only unless the exact value "1" is set,
      # so the binary is safe to run here.  This is the same command the local
      # gate runs (docs/build.md).
      - name: Test the corpus-free plan_recalc checks
        shell: bash
        run: |
          export MPP_NO_CORPUS=1
          ctest --test-dir build -C Release --output-on-failure --timeout 60 -R '^plan_recalc$'

      # Wave 23 (A-7c): the committed fixtures must match their pinned hashes on
      # every runner, not only the Windows Qt job.
      - name: Committed fixtures match their pinned hashes
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then
            python3 scripts/check_fixtures.py
          else
            python scripts/check_fixtures.py
          fi

      # Re-runs the reader with the corpus forced absent.  GitHub's runners have
      # no corpus/ anyway, so this repeats the step above by design: MPP_NO_CORPUS
      # is the supported way to prove the committed-fixture path on a machine that
      # *does* have the client corpus (a self-hosted runner or a developer box),
      # and it fails loudly if the reader ever starts needing corpus/ for the
      # checks that are supposed to run everywhere.  Cheap: one test, well under
      # a second (docs/ci.md, tests/data/README.md).
      - name: Test the reader without the corpus (committed fixture only)
        shell: bash
        run: |
          export MPP_NO_CORPUS=1
          ctest --test-dir build -C Release --output-on-failure --timeout 60 -R '^mpp_reader$'

  # Wave 33 (W33-2.4, audit D-3).  The fuzz lane used to call only
  # `mpp::load_bytes`: the writer's container parser, the MSPDI importer and the
  # CSV surface never saw mutated bytes, and no CI job compiled with a
  # sanitizer.  This job builds the same core tree with clang and
  # -fsanitize=address,undefined, then runs the core suite and every fuzz
  # target (fuzz_reader now feeds CfbDocument::from_bytes as well; fuzz_xml
  # feeds import_mspdi and export_csv).  -fno-sanitize-recover=all makes a UBSan
  # report fail the run instead of printing a line nobody reads.  The same
  # trigger guard as build-and-test, so a failed qt-shell does not spend a run.
  ubuntu-asan:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'push')
    name: ubuntu-asan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Configure (ASan + UBSan)
        shell: bash
        run: |
          cmake -S . -B build-asan \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCORE_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        shell: bash
        run: cmake --build build-asan --config RelWithDebInfo -j 2

      # Same exclusion as the main job: plan_recalc's golden is corpus-bearing
      # and refreshed deliberately.  The corpus-free plan_recalc checks are its
      # own step below the main matrix job; they are not duplicated here.
      - name: Test the core suite and the fuzz targets under ASan + UBSan
        shell: bash
        run: |
          export MPP_NO_CORPUS=1
          ctest --test-dir build-asan -C RelWithDebInfo -E plan_recalc \
                --output-on-failure --timeout 180
