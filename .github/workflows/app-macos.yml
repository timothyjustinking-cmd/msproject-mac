# macOS verification for the AppKit shell in app/ (app shell v3, W46).
#
# WHY A SEPARATE WORKFLOW.  ci.yml owns the portable core's portability matrix and
# must not grow an app job; app/ is a standalone CMake project (it is not added to
# the root CMakeLists.txt), so it gets its own configure/build/test.  Nothing here
# depends on ci.yml and ci.yml depends on nothing here.
#
# WHAT THIS PROVES, AND WHY IT IS THE ONLY PROOF:
#   * main.mm is Objective-C++ against AppKit, which cannot be compiled on the
#     Windows development box.  This job is where the shell is compiled at all:
#     the menu bar built from app::menu_specs(), the Preferences panel, the filter
#     dialog, the PDF export panels, NSOpenPanel/NSSavePanel, the mouse/keyboard
#     handling and the drawing code all get their first compiler here, with
#     -Wall -Wextra -Wpedantic -Werror, so an AppKit deprecation, a misspelt
#     selector or an ARC slip is a red build rather than a warning nobody reads.
#   * the app target links the real core libraries (core_mpp, core_sched,
#     core_view, core_sheet, core_gantt, core_mppwrite, core_render, plus
#     core_model) built from this tree, with every core stream test switched off by
#     app/CMakeLists.txt.  core_render is new in v3: File > Export PDF writes
#     through it.
#   * the fourteen headless tests build and pass on macOS as well as on Windows:
#       app_layout    (layout_model_tests)   mapping + the packed-date identity
#       app_selection (selection_model_tests) sheet<->Gantt selection, collapse,
#                                            edit/undo through SheetModel
#       app_document  (document_tests)       the real save round trip, on the
#                                            committed synthetic fixture
#       app_prefs     (prefs_tests)          the preference model + its parser
#       app_menu      (menu_tests)           the menu bar as data: every menu,
#                                            action, key equivalent, enablement
#       app_filter    (filter_tests)         rule -> FilterDefinition, matching,
#                                            the displayed-row restriction
#       app_export    (export_tests)         real PDFs (sheet + Gantt, filtered),
#                                            written under build-app/test-out
#       app_views / app_edit / app_fields / app_edits_fields / app_edits_links
#                                            views, insert/delete + undo, stored and
#                                            formula columns, Task Fields and
#                                            Predecessors dialogs
#       app_print     (page_layout_tests)    page geometry shared by printing and
#                                            Export PDF (wave 14)
#       app_start_warning (start_edit_warning_tests)
#                                            linked-pin / manual-task save warning
#                                            model (wave 14)
#     The corpus probes inside app_layout print SKIP on a runner (no corpus/), as
#     they must; app_document writes only under build-app/test-out and app_export
#     writes only its own synthetic PDFs there.
#
# The configure log says which save path app/document.cpp compiled: "found --
# saves use mppwrite::save_date_edits" when core/mppwrite/save.h is present, or
# "absent -- saves use pin_task_start + CfbDocument::save" otherwise.  Both build;
# the message is there so a reviewer knows which one CI proved.
#
# NO GUI LAUNCH.  There is no window server session on a runner and no need for
# one: "built + the bundle executable exists + it links AppKit" is the claim.

name: app-macos

# COST CONTROL (2026-10-23): the included Actions minutes are exhausted and
# macOS runners bill at 10x.  Do NOT trigger on every push -- a manual dispatch
# or a version tag is a deliberate spend.  Run locally where possible:
#   build\vs-w14 (Windows MSVC) proves the core suite; only ObjC++/AppKit needs
#   the macos-appkit job, so push a tag (or dispatch) once per wave, not per commit.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-app:
    name: macos-appkit
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Standalone configure of app/ only: no -S . (that is ci.yml's job), and no
      # --parallel anywhere (see docs/build.md).  pipefail so a failed configure is
      # not masked by the `tee` that records its log.
      - name: Configure the app project
        shell: bash
        run: |
          set -o pipefail
          cmake -S app -B build-app \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DAPP_BUILD_TESTS=ON \
            -DCORE_WARNINGS_AS_ERRORS=ON 2>&1 | tee configure.log
          # Make the save-path choice visible in the build log.
          grep -E "app: (core/mppwrite/save.h|not APPLE)" configure.log

      # Builds every target in the project: the core libraries the shell links,
      # the three headless tests, and msproject_app.app (the ObjC++ / AppKit
      # target).  No --parallel: one job thread, as docs/build.md requires.
      - name: Build
        shell: bash
        run: cmake --build build-app --config Release

      # The test names are part of the contract: a silently unregistered test is
      # as bad as a failing one.
      - name: The fifteen headless tests are registered
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build-app -C Release -N | tee tests.txt
          grep -q "app_layout" tests.txt
          grep -q "app_selection" tests.txt
          grep -q "app_document" tests.txt
          grep -q "app_prefs" tests.txt
          grep -q "app_menu" tests.txt
          grep -q "app_filter" tests.txt
          grep -q "app_export" tests.txt
          grep -q "app_views" tests.txt
          grep -q "app_edit" tests.txt
          grep -q "app_fields" tests.txt
          grep -q "app_edits_fields" tests.txt
          grep -q "app_edits_links" tests.txt
          grep -q "app_print" tests.txt
          grep -q "app_start_warning" tests.txt
          grep -q "app_smoke" tests.txt

      - name: Test (headless layout, selection, save, preferences, menu, filter, export, views, edit, fields, field/link edits, print, start warning, smoke)
        shell: bash
        run: ctest --test-dir build-app -C Release --output-on-failure --timeout 120

      # The gate the brief asks for: the ObjC++ application target actually
      # materialised and actually links AppKit.  If main.mm failed to compile or
      # link, the build step above already failed; this makes the artifact
      # explicit in the log.
      - name: Prove the app bundle was produced
        shell: bash
        run: |
          set -euo pipefail
          app="build-app/msproject_app.app/Contents/MacOS/msproject_app"
          test -x "$app"
          file "$app"
          otool -L "$app" | grep -q "AppKit"
          # v3 uses UTType for the open/export panels' content filters, which lives in
          # its own framework; prove it is linked rather than assumed.
          otool -L "$app" | grep -q "UniformTypeIdentifiers"
          echo "OK: $app exists and links AppKit + UniformTypeIdentifiers"

      # Wave 15 (W63): the self-smoke.  The app builds its own window, loads a COPY of
      # the committed fixture, prints both print jobs to PDF through run_print_view,
      # snapshots the window to PDF + PNG and writes smoke.json; it exits non-zero when
      # any check failed.  No panels, no dialogs, no interaction, so it is safe on a
      # runner.  `if: always()` so the artifacts survive a failure -- a failed smoke is
      # exactly when its artifacts matter.
      - name: Self-smoke (window, print to PDF, snapshot)
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p smoke-out
          app="build-app/msproject_app.app/Contents/MacOS/msproject_app"
          test -x "$app"
          "$app" --smoke tests/data/synthetic-base.mpp --out "$PWD/smoke-out" 2>&1 | tee smoke.log

      # The operator has no Mac.  A zipped .app is the only way a borrowed
      # machine can run the real thing, so upload it (and any PDFs the exporter
      # wrote) on every run, pass or fail.
      #   To run it: unzip, then `xattr -dr com.apple.quarantine msproject_app.app`
      #   (the bundle is unsigned), then open it.
      - name: Package the app bundle for a borrowed Mac
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d build-app/msproject_app.app ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              build-app/msproject_app.app "msproject_app-${GITHUB_SHA::7}-macos.zip"
            ls -l msproject_app-*.zip
          else
            echo "no app bundle to package"
          fi

      - name: Upload the app bundle and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msproject-app-macos-${{ github.sha }}
          if-no-files-found: warn
          path: |
            msproject_app-*-macos.zip
            build-app/test-out/**
            smoke-out/**
            smoke.log
